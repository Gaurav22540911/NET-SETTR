<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forgot Password | NET-SETTR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="forgot-password.css" />
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <div class="logo" onclick="window.location.href='index.html'">
    <img src="logo.png" />
    <span>NET-SETTR</span>
  </div>
</nav>

<!-- Container -->
<div class="fp-container">

  <!-- STEP 1 -->
  <div class="fp-box" id="step-login">
    <h2>Forgot Password</h2>
    <p>Enter your email or phone</p>

    <input id="loginId" placeholder="Email or Phone" />
    <button id="sendOtpBtn">Send OTP</button>
  </div>

  <!-- STEP 2 -->
  <div class="fp-box hidden" id="step-otp">
    <h2>Verify OTP</h2>

    <div class="otp-inputs">
      <input maxlength="1" />
      <input maxlength="1" />
      <input maxlength="1" />
      <input maxlength="1" />
      <input maxlength="1" />
      <input maxlength="1" />
    </div>

    <button id="verifyOtpBtn">Verify OTP</button>
  </div>

  <!-- STEP 3 -->
  <div class="fp-box hidden" id="step-reset">
    <h2>Reset Password</h2>

    <input type="password" id="newPassword" placeholder="New Password" />
    <input type="password" id="confirmPassword" placeholder="Confirm Password" />

    <button id="resetPasswordBtn">Reset Password</button>
  </div>
</div>

<!-- Loader -->
<div class="loader hidden" id="loader">
  <div class="spinner"></div>
</div>

<!-- Modal -->
<div class="modal hidden" id="modal">
  <div class="modal-box">
    <p id="modalText"></p>
    <button id="modalOk">OK</button>
  </div>
</div>

<script src="forgot-password.js"></script>
</body>
</html>
