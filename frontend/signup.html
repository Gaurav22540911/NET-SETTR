<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | NET-SETTR</title>
  <link rel="stylesheet" href="signup.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar">
  <div class="logo" onclick="window.location.href='index.html'">
    <img src="logo.png" alt="NET-SETTR">
    <span>NET-SETTR</span>
  </div>
</nav>

<div class="signup-container">
  <div class="signup-box">
    <h1>Create Your Account</h1>

    <form id="signup-form">

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="fullname" required>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" required>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="phone" maxlength="10" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" minlength="8" required>
      </div>

      <button id="signup-btn" type="submit">Sign Up</button>

      <p class="login-link">Already have an account?
        <a href="login.html">Login</a>
      </p>
    </form>
  </div>
</div>

<!-- OTP Popup -->
<div class="otp-popup" id="otp-popup">
  <div class="otp-box">
    <h2>Email Verification</h2>
    <p>We sent an OTP to your email.</p>

    <input type="text" id="otp-input" maxlength="6" placeholder="Enter OTP">
    <button id="verify-btn">Verify OTP</button>
  </div>
</div>

<script src="signup.js"></script>
</body>
</html>
