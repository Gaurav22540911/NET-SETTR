<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | NET-SETTR</title>
  <link rel="stylesheet" href="signup.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="logo" onclick="window.location.href='index.html'">
    <img src="logo.png" alt="NET-SETTR">
    <span>NET-SETTR</span>
  </div>
</nav>

<!-- SIGNUP -->
<div class="signup-container">
  <div class="signup-box">
    <h1>Create Your Account</h1>

    <form id="signup-form">

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="fullname" required>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" required>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="phone" maxlength="10" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" minlength="8" required>
      </div>

      <!-- PASSWORD STRENGTH -->
      <div class="password-meter">
        <div class="strength-bar">
          <span id="strengthFill"></span>
        </div>
        <p class="strength-text" id="strengthText">Password strength</p>
      </div>

      <button id="signup-btn" type="submit">Sign Up</button>

      <p class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
      </p>

    </form>
  </div>
</div>

<!-- OTP POPUP -->
<div class="otp-popup" id="otp-popup">
  <div class="otp-box">
    <h2>Email Verification</h2>
    <p>Enter the 6-digit OTP sent to your email</p>

    <div class="otp-inputs">
      <input maxlength="1">
      <input maxlength="1">
      <input maxlength="1">
      <input maxlength="1">
      <input maxlength="1">
      <input maxlength="1">
    </div>

    <button id="verify-btn">Verify OTP</button>
  </div>
</div>

<!-- LOADING OVERLAY -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loader-box">
    <div class="spinner"></div>
    <p id="loadingText">Sending OTP...</p>
  </div>
</div>

<!-- TOAST -->
<div class="custom-toast" id="toast"></div>

<script src="signup.js"></script>
</body>
</html>
