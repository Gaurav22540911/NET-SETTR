<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login | NET-SETTR</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo" onclick="window.location.href='index.html'">
      <img src="logo.png" alt="NET-SETTR" />
      <span>NET-SETTR</span>
    </div>
  </nav>

  <!-- Login -->
  <div class="login-container">
    <div class="login-box">
      <h1>Welcome back 👋</h1>

      <form id="login-form">
        <div class="form-group">
          <label>Email or Phone</label>
          <input type="text" id="loginId" placeholder="you@example.com or 9876543210" required />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Your password" required minlength="8" />
        </div>

        <p class="forgot-link">
        <a href="forgot-password.html">Forgot password?</a>
        </p>

        <button id="login-btn" type="submit">Login</button>

        <p class="helper">
          New here? <a href="signup.html">Create an account</a>
        </p>
      </form>
    </div>
  </div>

  <!-- Loader -->
  <div class="loader hidden" id="loader">
    <div class="spinner"></div>
  </div>

  <!-- Custom Modal -->
  <div class="modal hidden" id="modal">
    <div class="modal-box">
      <p id="modalText"></p>
      <div class="modal-actions">
        <button id="modalCancel">Cancel</button>
        <button id="modalConfirm">Continue</button>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
