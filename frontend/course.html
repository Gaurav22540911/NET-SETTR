<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course Details | NET-SETTR</title>
  <link rel="stylesheet" href="course.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo" id="logoClick">
      <img src="logo.png" alt="NET-SETTR Logo" />
      <span>NET-SETTR</span>
    </div>
    <ul class="menu" id="navbarMenu"></ul>
  </nav>

  <!-- LOADER -->
  <div id="loader" class="loader hidden">
    <div class="spinner"></div>
  </div>

  <!-- Centered Course Card -->
  <section class="course-card">

  <div class="course-left">
    <h1 id="course-title"></h1>
    <p id="course-desc"></p>
  </div>

  <div class="course-right">
    <img id="course-image" class="course-img" />
    <div id="price-box"></div>
    <button id="buy-btn">Buy Now</button>
  </div>

</section>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="course.js"></script>
</body>
</html>
