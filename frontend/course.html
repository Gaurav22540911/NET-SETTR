<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course Details | NET-SETTR</title>
  <link rel="stylesheet" href="course.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo" id="logoClick">
      <img src="logo.png" alt="NET-SETTR Logo" />
      <span>NET-SETTR</span>
    </div>
    <ul class="menu" id="navbarMenu"></ul>
  </nav>

  <!-- LOADER -->
  <div id="loader" class="loader hidden">
    <div class="spinner"></div>
  </div>

  <!-- COURSE HEADER -->
  <section class="course-card">
    <div class="course-left">
      <h1 id="course-title"></h1>
      <p id="course-desc"></p>
    </div>

    <div class="course-right">
      <img id="course-image" class="course-img" />
      <div id="price-box"></div>
      <button id="buy-btn">Buy Now</button>
    </div>
  </section>

  <!-- COURSE CONTENT -->
  <section class="course-content" id="course-content-section">
    <h2>Course Content</h2>
    <div id="slides-container" class="slides-wrapper">
      <p class="placeholder">Loading course content...</p>
    </div>
  </section>

  <!-- SUCCESS MODAL -->
  <<div id="paymentSuccessModal" class="success-modal hidden">
  <div class="modal-box">
    <h2>🎉 Payment Successful</h2>
    <p>Your course is now unlocked!</p>
    <button id="continueBtn">Continue</button>
  </div>
</div>

<script>
document.getElementById("continueBtn").addEventListener("click", () => {
  document.getElementById("paymentSuccessModal").classList.add("hidden");
  window.location.reload();
});
</script>


  <!-- Razorpay Script -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <!-- Custom script: should be placed LAST -->
  <script src="course.js"></script>

  <!-- Modal handler -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("continueBtn").addEventListener("click", () => {
        document.getElementById("paymentSuccessModal").classList.add("hidden");
        window.location.reload();
      });
    });
  </script>

</body>
</html>
