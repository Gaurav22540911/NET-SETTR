<!DOCTYPE html>
<html lang="en">

  <title>Course Details | NET-SETTR</title>

</head>
<body>

  <nav class="navbar">

      <img src="logo.png" alt="NET-SETTR Logo" />

  </nav>

  <!-- Course Details Section -->
